<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="Превью Cabaret Black Hole — first one song">
    <title>Превью — Cabaret Black Hole</title>
    <script>
        (function () {
            try {
                if (localStorage.getItem("cbh-theme") === "light") {
                    document.documentElement.setAttribute("data-theme", "light");
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute("content", "#eef0f2");
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="css/site.css">
</head>
<body class="has-photo-bg">
    <a class="skip-link" href="#content">К содержанию</a>

    <main id="content" class="container">
        <p class="philosophy-text">
            Путь в тысячу ли начинается с одного шага!<br>
            Как и беспрецедентное действо с одной, только лишь, гениальной идеи.
        </p>

        <section class="timeline-container" aria-labelledby="track-title">
            <h1 class="timeline-title" id="track-title">«first one song»</h1>

            <div class="custom-player">
                <audio id="audioPlayer" src="Cabaret.mp3" preload="metadata"></audio>

                <div class="player-controls">
                    <button type="button" class="play-btn" id="playBtn" aria-label="Играть" aria-pressed="false">
                        <span class="play-icon" id="playIcon"></span>
                        <span class="pause-icon" id="pauseIcon"></span>
                    </button>

                    <div class="progress-container" id="progressContainer" role="slider" tabindex="0" aria-label="Прогресс трека" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>

                    <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                </div>

                <div class="volume-control">
                    <span class="volume-icon" aria-hidden="true">♪</span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70" aria-label="Громкость">
                </div>
            </div>
        </section>

        <div class="page-actions">
            <a href="index.html" class="back-btn">← Вернуться в кабаре</a>
        </div>
    </main>

    <script src="js/player.js" defer></script>
</body>
</html>
